# Render 部署配置（免费档 + MongoDB Atlas 持久化，无需持久化磁盘）
# 用法：Render 控制台 → New + → Blueprint → 连接本仓库（自动读取本文件）
services:
  - type: web
    name: vivian-workspace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: "10000"
      - key: ALLOW_ORIGIN
        value: "*"
      - key: MONGODB_URI
        # 在 Render 环境变量里填入你的 MongoDB Atlas 连接串（mongodb+srv://...）
        # 部署前务必先在 Render 控制台把此环境变量填好，否则会退回本地文件存储（数据不持久）
        sync: false

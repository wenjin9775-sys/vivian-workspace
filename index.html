  <div id="modal-root"></div>

  <script>
  /* 初始化错误兜底 */
  (function(){
    var box = document.getElementById('app-error');
    if (!box) {
      box = document.createElement('div');
      box.id = 'app-error';
      box.style.cssText = 'display:none;position:fixed;top:80px;left:20px;right:20px;z-index:9999;background:#fdf2f8;border:2px solid #ec4899;color:#9d174d;padding:18px 20px;border-radius:14px;font-family:system-ui,Microsoft YaHei;font-size:13px;white-space:pre-wrap;max-height:70vh;overflow:auto;box-shadow:0 10px 30px rgba(236,72,153,.25);';
      document.body.appendChild(box);
    }
    function show(msg){
      if (typeof msg === 'object' && msg && msg.message) msg = msg.message + '\n' + (msg.stack || '');
      box.textContent += (box.textContent ? '\n\n' : '') + msg;
      box.style.display = 'block';
    }
    window.onerror = function(msg, url, line, col, err){
      show('JS ERROR at ' + (url||'app.js') + ':' + line + ':' + col + '\n' + msg + '\n' + (err && err.stack || ''));
      return true;
    };
    window.addEventListener('unhandledrejection', function(e){
      show('Unhandled Promise Rejection:\n' + (e.reason && (e.reason.stack || e.reason.message || e.reason)));
    });
  })();
  </script>
